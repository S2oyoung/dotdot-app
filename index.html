<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script>
      // 휴대폰: 화면을 Figma 폭(393)으로 두고 브라우저가 기기 폭에 맞춰 그대로 확대·축소하게 함
      // (CSS zoom 을 쓰면 아이폰 사파리에서 손가락 좌표와 요소 좌표 단위가 달라져 카드·차트 터치가 어긋남)
      (function () {
        var w = Math.min(screen.width, screen.height);
        if (w && w < 600) {
          document.querySelector('meta[name=viewport]').setAttribute('content', 'width=393, user-scalable=no, viewport-fit=cover');
        }
      })();
    </script>
